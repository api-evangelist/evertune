  reason: no-developer-program
  detail: >-
    Evertune is a consumer of the model providers' APIs rather than a publisher of
    one — its own FAQ says base-model data is "reachable only through direct API
    integration with the model provider" — and it ships no developer surface of its
    own: the pricing page's two demo-led tiers name no API access, the Intercom help
    center holds three end-user articles, and app.evertune.ai is a closed SPA whose
    backend is undocumented; the only machine-readable thing Evertune serves is the
    Auth0 OIDC discovery document on auth.evertune.ai, which signs users in to that
    app.
