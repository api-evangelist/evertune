method: probed
source: >-
  live probes of Evertune hosts 2026-08-13 (auth.evertune.ai discovery
  documents, www/app/docs .well-known matrix, contract-discovery sweep)
note: >-
  Evertune is a data CONSUMER of the major model-provider APIs (its own FAQ:
  "Base model responses are reachable only through direct API integration with
  the model provider"). It publishes no first-party API of its own, so every
  API-contract standard below is recorded false on evidence, not on assumption.
  The standards it does conform to are all identity-layer, served by its Auth0
  tenant on auth.evertune.ai.
