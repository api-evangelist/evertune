note: >-
  Evertune serves a real /.well-known discovery surface on auth.evertune.ai --
  its Auth0 tenant on its own domain (CNAME to
  evertune-cd-hgvejvwbyvwd7xad.edge.tenants.us.auth0.com, issuer
  https://auth.evertune.ai/), which is the Login host already recorded in
  apis.yml. Both OIDC discovery (OpenID Connect Discovery 1.0) and RFC 8414
  OAuth 2.0 Authorization Server Metadata return 200 with the same JSON
  document. This is the sign-in surface for the Evertune web application; it is
  NOT a developer API authorization server -- Evertune publishes no first-party
  API, and no client-credentials developer program is documented anywhere on
  its site or help center. www.evertune.ai, app.evertune.ai and
  docs.evertune.ai return 404 on every /.well-known path probed. The one 200 on
  docs.evertune.ai/.well-known/security.txt is served by Intercom (the
  help-center platform) and belongs to Intercom's Bugcrowd program
  (Canonical: app.intercom.com) -- it is NOT Evertune's own security policy, so
  no SecurityTxt pointer is wired for Evertune.
